version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: dietai-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: your_secure_password  # 记得改成你自己的密码
      POSTGRES_DB: training_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 350M  # 限制最大占用内存不超过 350MB

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dietai-backend
    restart: always
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:your_secure_password@postgres:5432/training_db?schema=public
      - PORT=3000
    ports:
      - "3000:3000"
    depends_on:
      - postgres
    deploy:
      resources:
        limits:
          memory: 350M  # 限制 NestJS 最大占用内存不超过 350MB

volumes:
  pgdata: